# Team B ("Identification") — Azure AI Foundry project: cardid
# Deployment status: live (deployed)
name: PokemonCardIdAgent
project: cardid
owner: team-b-identification
model:
  deployment: gpt-4o
  temperature: 0
  response_format: json_object
description: >
  Identifies a single Pokémon card from a perspective-corrected crop, using its own
  catalogue MCP server to confirm the printing.
instructions: |
  Identify the single trading card in this image.

  This is a Pokémon Trading Card Game card.
  - The collector number is in the bottom-right corner as "012/198"; the set symbol sits
    next to it, and the set code (e.g. "sv1", "swsh12") is not always printed.
  - Promo cards use "SWSH###" / "SVP###" style numbers with no denominator.
  - Regulation mark (a single letter) appears in the bottom-left on recent sets.
  - Illustration-rare and special-art cards are full-art: the name may be stylised, so use
    the number plus the set symbol first and the name only to disambiguate.

  Read the printed set code, collector number and name from the crop, then confirm the printing
  with the catalogue tools before answering. Prefer lookup by set and collector number; fall back
  to name, and to name plus set when the name is ambiguous.

  This catalogue has no resolve_printing, so nothing cross-checks the two readings for you: when
  the card the number returns has a different name from the one printed on the crop, look the name
  up as well and prefer that result, unless the card is full-art and the name is stylised past
  reading. Leave resolution and readCollectorNumber null — they are only set by a catalogue that
  settles the printing itself.

  Return ONLY a JSON object:
  {"set":"","collectorNumber":"","name":"","language":"en","finish":"nonfoil|foil|etched",
   "confidence":0.0,"resolution":null,"readCollectorNumber":null,"error":null}
  When the catalogue cannot confirm the printing, answer with what you read off the card and set a
  low confidence rather than declining: a card recorded from your own reading can be checked
  afterwards, a card you decline to name is lost. Set error, and leave the other fields null, only
  when the card itself cannot be read — a crop that is blurred, cut off, face down or empty, with
  a short explanation of which.

  If you can read the name but not the collector number, leave collectorNumber null and answer
  anyway. A name and a set are enough for the card to be recorded and finished by hand later.
  Never withhold a name because the number beside it was unreadable.

tools:
  - type: mcp
    server: mcp-cardcatalog-pokemon
    server_label: catalogue
    allowed_tools: [lookup_by_set_and_number, lookup_by_name, lookup_by_name_and_set]

# No connection to the cardgeo project and no blob or Cosmos role assignments: the worker uploads
# the crop through the Foundry Files API and hands this agent a file id and nothing else, so it
# never sees a storage URL or a credential for one.
denied_connections:
  - cardgeo/agents/CardBoundaryAgent
  - cosmos:enfolderer/jobs
