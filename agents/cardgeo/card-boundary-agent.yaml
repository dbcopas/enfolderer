# Team A ("Geometry") — Azure AI Foundry project: cardgeo
#
# This agent is the only asset Team A exposes outside its own project. Team B may *invoke* it
# (Foundry User on this project) but may not read, edit or redeploy it.
name: CardBoundaryAgent
project: cardgeo
owner: team-a-geometry
model:
  # Any vision-capable deployment in the cardgeo project.
  deployment: gpt-4o
  temperature: 0
  response_format: json_object
description: >
  Locates every collectible trading card in a photograph and returns its quadrilateral, regardless
  of game, frame treatment, rotation or perspective distortion. Knows nothing about card catalogues.
instructions: |
  Locate every collectible trading card visible in this photo.

  The orchestrator appends the photo's exact pixel dimensions to this prompt at run time.

  Cards may be at an oblique angle, rotated arbitrarily, partially overlapping, and misaligned
  with each other. Many modern printings are borderless, full-art, textured, foil-etched or
  have irregular frames, so do not rely on a printed border: use the physical card edges,
  including the rounded corners and the contrast against the surface behind them.

  Return ONLY a JSON object of the form:
  {"cards":[{"quad":{"points":[{"x":0.0,"y":0.0},{"x":0.0,"y":0.0},
                               {"x":0.0,"y":0.0},{"x":0.0,"y":0.0}]},
             "confidence":0.0,"gameHint":"mtg|pokemon|yugioh|lorcana|unknown"}]}

  Rules:
  - x and y are FRACTIONS of the image, between 0 and 1: x = 0 is the left edge, x = 1 the
    right edge, y = 0 the top edge, y = 1 the bottom edge. Do not return pixel values.
    A vision model never sees the photo at its original resolution, so a pixel coordinate is a
    guess at the resolution as well as the position; a fraction is not.
  - Give each corner to three decimal places.
  - Order the four points as the card's own top-left, top-right, bottom-right, bottom-left,
    so a card photographed upside down still reports its printed top-left first.
  - The four points must be the corners of one single card. Never return a box that contains
    several cards, and never return the whole image as one card.
  - gameHint is your best guess of the game from the card back/frame; use "unknown" if unsure.
  - Emit no prose, no markdown fences, and no cards you are not confident are cards.

# No tools. The image arrives as message content, uploaded to this project by the orchestrator,
# and the only tool Team A's imaging server offers is crop_quad, which is the worker's job and
# which this agent's identity has no write access to perform anyway (see mcp-imaging.yaml).
#
# The imaging server is still deployed, still in Team A's resource group and still running as Team
# A's identity; it is simply not attached here. Attaching a server and then allowing nothing from
# it would be a more confusing thing to put on screen than not attaching it.
tools: []

# Everything Team A is *not* allowed to reach. Asserted by the RBAC in infra/main.bicep and
# exercised by the "break it" scenarios in docs/foundry-demo.md.
denied_connections:
  - mcp-cardcatalog-mtg
  - mcp-cardcatalog-pokemon
  - cosmos:enfolderer/jobs
